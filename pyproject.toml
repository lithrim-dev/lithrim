[project]
name = "lithrim-bench"
version = "0.1.0"
description = "Deterministically-labeled clinical-AI artifact verification benchmark generator. Backs the Lithrim research paper and the Lithrim Bench developer product."
authors = [{name = "Lithrim"}]
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
# WS-3a: the optional verification harness (DSPy bench-gated JUTE validator
# generator + live :3031 apply). Kept OUT of `dependencies` so the default
# install stays offline-deterministic (pydantic+pandas only). The KB/RAG/ONNX
# stack (pinecone, onnxruntime) lands as a separate `verification-kb` extra in
# WS-3b with that code. Versions track the spike venv (dspy 3.2.1, httpx 0.28.1).
verification = [
    "dspy>=3.2",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lithrim_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
