# Lithrim Bench — Community Edition local stack (CE Build C).
#
#   docker compose up        # → BFF on :8787, UI on :5180
#
# Zero-config: the BFF auto-seeds the neutral `_core` sample on first boot and `make demo`
# (offline, $0, no keys) runs without any of the env vars below. Bring a model key (BYOK) to
# grade live — set it in your shell or a repo-root `.env` (docker compose auto-loads `.env`).
#
# Clean by construction: state lives in a Docker-managed named volume (`lithrim_out`), NOT a host
# bind — so a fresh `up` seeds only the neutral `_core` sample and never inherits the maintainer's
# host `out/` (dev workspaces + agents pinned to packs the container doesn't ship). State persists
# across `up`/`down`; `docker compose down -v` wipes it back to the clean seed.
#
# Chat: the `claude` CLI assistant cannot run in a container — set LITHRIM_CHAT_PROVIDER=anthropic
# + ANTHROPIC_API_KEY (below) to drive the conversational surface via the Anthropic API. Grading
# and `make demo` do NOT need it.

services:
  bff:
    build:
      context: .
      dockerfile: Dockerfile.bff
    image: lithrim-bench-bff
    ports:
      - "8787:8787"
    environment:
      # BYOK — grading provider (all unset by default; the demo/replay needs none).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      LITHRIM_LLM_PROVIDER: ${LITHRIM_LLM_PROVIDER:-}
      # Conversational assistant (containerized chat → Anthropic API, not the local claude CLI).
      LITHRIM_CHAT_PROVIDER: ${LITHRIM_CHAT_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Optional inbound auth (set a token to require Bearer auth on every non-/health request).
      LITHRIM_BFF_TOKEN: ${LITHRIM_BFF_TOKEN:-}
      # Optional Pro pack discovery (a path INSIDE the container; bind-mount it if you set this).
      LITHRIM_BENCH_PACKS_DIR: ${LITHRIM_BENCH_PACKS_DIR:-}
    volumes:
      # A Docker-managed NAMED VOLUME (not a host bind): a fresh `up` starts EMPTY, so the BFF
      # auto-seeds only the neutral `_core` sample — a CLEAN CE, never the maintainer's host `out/`.
      # Persists config SQLite + run blobs + per-workspace .connector_env across `up`/`down`;
      # `docker compose down -v` resets to the clean seed. The in-app provider key (.provider_env)
      # lives in the container for the session (applied live, no restart); pass keys via env for
      # cross-`down` persistence. (Never bind-mount single files that may not exist on the host —
      # docker creates them as DIRECTORIES and crashes the env-loader.)
      - lithrim_out:/app/out
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8787/health"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5
    networks:
      - lithrim

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
      args:
        # The browser hits this origin directly (CORS-allowed, host-published). NOT http://bff:8787
        # — that is container-internal and unreachable from the host browser.
        VITE_BFF_URL: ${VITE_BFF_URL:-http://localhost:8787}
    image: lithrim-bench-ui
    ports:
      - "5180:5180"
    environment:
      VITE_BFF_URL: ${VITE_BFF_URL:-http://localhost:8787}
    depends_on:
      bff:
        condition: service_started
    networks:
      - lithrim

networks:
  lithrim:
    driver: bridge

volumes:
  lithrim_out:   # clean-seeded CE state; `docker compose down -v` resets it
